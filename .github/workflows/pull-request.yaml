name: 'Pull Request'

on:
  pull_request:
    branches:
      - main
  # The same required checks on a merge queue's merge commits; inert until the repository is
  # organization-owned (.github/settings.yml).
  merge_group:

permissions:
  contents: read

concurrency:
  # A merge_group event has no PR number; its ref is unique per queue entry.
  group: pull-request-root-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which Terraform deployments a diff reaches comes from moon's affected query: each
  # deploy-*:plan marker's `inputs` list what its environment depends on (decision 13).
  changed:
    # Skipped until root's bootstrap writes the repository variables (docs/new-repo.md).
    if: vars.WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    outputs:
      infrastructure-root: ${{ steps.moon.outputs.root }}
      infrastructure-staging: ${{ steps.moon.outputs.staging }}
      infrastructure-prod: ${{ steps.moon.outputs.prod }}
    steps:
      # moon needs full history to find the merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: 'blob:none'
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          # Decision 35.
          cache: false # decision 35
      - id: moon
        name: Compute moon-affected deployments
        shell: bash
        env:
          # `moon query affected` reads MOON_BASE as `moon ci` does. On merge_group the queue commit diffs
          # against origin/main, a superset of this PR's changes (decision 12).
          MOON_BASE: origin/main
        run: |
          # Defaults, no --upstream/--downstream: the deploy markers' dependsOn is apply ordering, not an
          # affectedness edge (decision 13).
          moon query affected > affected.json
          for env in root staging prod; do
            # `.tasks` is absent when nothing is affected.
            val=$(jq -r --arg t "deploy-$env:plan" '(.tasks // {}) | has($t)' affected.json)
            echo "$env=$val" >> "$GITHUB_OUTPUT"
          done

  # The required moon checks, one leg each so each keeps its check name. `:task` runs a task in every
  # project that has it (decision 12).
  # - lint-check: every lint/format/build task, and the only place `:validate` runs (`runInCI: 'only'`).
  # - test: every project's tests, plus the image so a broken build fails the PR, not the publish.
  # - api-drift: packages/api:drift, both generators re-run and diffed.
  moon:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint-check
            targets: ':format :lint :vet :typecheck :build :validate root:wire-types root:projects-covered root:go-version-sync root:decision-links'
          - check: test
            targets: ':test services/backend:image'
          - check: api-drift
            targets: 'packages/api:drift'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: 'blob:none'
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          # moon setup installs proto and every tool before any task starts (decision 35).
          auto-setup: true
          cache: false # decision 35
      # The Firestore adapter's tests skip without an emulator: this is the jar `gcloud emulators
      # firestore` runs, checksummed, on the runner's Java 21.
      - name: Start the Firestore emulator
        if: matrix.check == 'test'
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/firestore-emulator.jar" \
            https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.22.0.jar
          echo "9b6498b7f62714d67f48f59b3818883cd682dbcd46b9f59511de81c97bb5166c  $RUNNER_TEMP/firestore-emulator.jar" | sha256sum -c -
          nohup "$JAVA_HOME_21_X64/bin/java" -jar "$RUNNER_TEMP/firestore-emulator.jar" --host=127.0.0.1 --port=8081 > "$RUNNER_TEMP/firestore-emulator.log" 2>&1 &
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8081 > /dev/null; do sleep 1; done'
          echo 'FIRESTORE_EMULATOR_HOST=127.0.0.1:8081' >> "$GITHUB_ENV"
      - name: moon ci
        shell: bash
        run: moon ci ${{ matrix.targets }}
        env:
          MOON_BASE: origin/main

  infrastructure-root:
    needs: changed
    if: needs.changed.outputs.infrastructure-root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAN_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/root'
          config_directory: 'infrastructure/config/root'
          # Placeholders: a PR plan holds no real token and doesn't refresh (decision 32).
          secrets: |
            TF_VAR_github_provider_token=plan-only
            TF_VAR_cloudflare_api_token=plan-only
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # infrastructure/env/** is shared, so a change plans against both environments.
  infrastructure-staging:
    needs: changed
    if: needs.changed.outputs.infrastructure-staging == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAN_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/staging'
          secrets: |
            TF_VAR_google_client_id=${{ vars.GOOGLE_CLIENT_ID }}
            TF_VAR_ci_service_account=${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  infrastructure-prod:
    needs: changed
    if: needs.changed.outputs.infrastructure-prod == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAN_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'
          secrets: |
            TF_VAR_google_client_id=${{ vars.GOOGLE_CLIENT_ID }}
            TF_VAR_ci_service_account=${{ vars.PROMOTE_SERVICE_ACCOUNT }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

