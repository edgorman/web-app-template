name: 'Push Commit'

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: push-commit-root-main
  cancel-in-progress: false

jobs:
  # Which Terraform deployments an apply reaches comes from moon's affected query, as in
  # pull-request.yaml. Only Terraform is decided this way: the backend and frontend are built on
  # every merge (decision 29).
  changed:
    # Skipped until root's bootstrap writes the repository variables (docs/new-repo.md); everything
    # that deploys waits on this job.
    if: vars.WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    outputs:
      infrastructure-root: ${{ steps.moon.outputs.root }}
      infrastructure-staging: ${{ steps.moon.outputs.staging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: 'blob:none'
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          # Decision 35.
          cache: false # decision 35
      - id: moon
        name: Compute moon-affected deployments
        shell: bash
        run: |
          # Diffed against the newest release tag before this commit, not `github.event.before`: the
          # concurrency group drops pending runs, so `before` can name a merge whose infrastructure was never
          # applied. HEAD~1 so a re-run of a tagged commit still sees its own changes. No tag fails open:
          # every deployment is marked affected.
          if base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD~1 2>/dev/null); then
            echo "Diffing against $base"
            export MOON_BASE="$base"
          else
            printf '%s=true\n' root staging >> "$GITHUB_OUTPUT"
            exit 0
          fi
          moon query affected > affected.json
          for pair in root=deploy-root:plan staging=deploy-staging:plan; do
            # `.tasks` is absent when nothing is affected.
            val=$(jq -r --arg t "${pair#*=}" '(.tasks // {}) | has($t)' affected.json)
            echo "${pair%%=*}=$val" >> "$GITHUB_OUTPUT"
          done

  # Builds on every merge and deploys it, so staging always shows this commit's version. One folder
  # feeds both buckets and the Worker, so the live site is never different from what's stored.
  services-frontend:
    # infrastructure-root is checked on its own: infrastructure-staging skips, rather than fails, after
    # it when staging isn't affected.
    needs: [changed, infrastructure-root, services-backend]
    if: |
      always() &&
      (needs.infrastructure-root.result == 'success' || needs.infrastructure-root.result == 'skipped') &&
      needs.services-backend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: ${{ vars.GCP_ROOT_PROJECT }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          secrets_list: |
            CLOUDFLARE_API_TOKEN=cloudflare_api_token
      # Looked up here: a matrix job's outputs don't say which leg wrote them.
      - id: backend
        name: Get Backend URL
        shell: bash
        run: |
          URL=$(gcloud run services describe backend-stag \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_PREFIX }}-stag \
            --format='value(status.url)')
          test -n "$URL" || { echo '::error::backend-stag URL not found'; exit 1; }
          echo "backend_url=$URL" >> "$GITHUB_OUTPUT"
      - id: short
        shell: bash
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/frontend-build
        with:
          google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: ./.github/actions/frontend-publish
        with:
          gcp_project_id: '${{ vars.GCP_PROJECT_PREFIX }}-stag'
          prod_project_id: '${{ vars.GCP_PROJECT_PREFIX }}-prod'
          sha: ${{ github.sha }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/frontend-deploy
        with:
          secrets: ${{ steps.secrets.outputs.secrets }}
          cloudflare_project_name: '${{ vars.GCP_PROJECT_PREFIX }}-stag'
          cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          backend_url: ${{ steps.backend.outputs.backend_url }}
          # Staging runs a commit, so it shows the short SHA; production shows its release tag (decision 30).
          version: ${{ steps.short.outputs.sha }}
          environment: 'staging'
          # Production's URL on staging too, so staging never competes with it in search results.
          site_url: ${{ vars.PRODUCTION_URL }}
          site_name: ${{ vars.SITE_NAME }}

  infrastructure-root:
    needs: changed
    if: needs.changed.outputs.infrastructure-root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: ${{ vars.GCP_ROOT_PROJECT }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          secrets_list: |
            TF_VAR_github_provider_token=github_provider_token
            TF_VAR_cloudflare_api_token=cloudflare_api_token
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/root'
          config_directory: 'infrastructure/config/root'
          secrets: ${{ steps.secrets.outputs.secrets }}

  # Waits on infrastructure-root so the IAM grants and APIs it applies land first.
  infrastructure-staging:
    needs: [changed, infrastructure-root]
    if: |
      always() &&
      needs.changed.outputs.infrastructure-staging == 'true' &&
      needs.changed.result == 'success' &&
      (needs.infrastructure-root.result == 'success' || needs.infrastructure-root.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/staging'
          secrets: |
            TF_VAR_google_client_id=${{ vars.GOOGLE_CLIENT_ID }}
            TF_VAR_ci_service_account=${{ vars.DEPLOY_SERVICE_ACCOUNT }}

  # One leg per image, built from the same Dockerfile with CMD=<image>; a second binary under cmd/
  # is added here. Follows infrastructure-staging so the deploy target exists.
  services-backend:
    name: services-${{ matrix.image }}
    # infrastructure-root is checked on its own, as in services-frontend: it creates the registries.
    needs: [changed, infrastructure-root, infrastructure-staging]
    if: |
      always() &&
      needs.changed.result == 'success' &&
      (needs.infrastructure-root.result == 'success' || needs.infrastructure-root.result == 'skipped') &&
      (needs.infrastructure-staging.result == 'success' || needs.infrastructure-staging.result == 'skipped')
    strategy:
      # A failed leg shouldn't cancel the other's staging deploy.
      fail-fast: false
      matrix:
        image: [backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/backend-deploy
        with:
          gcp_project_id: '${{ vars.GCP_PROJECT_PREFIX }}-stag'
          prod_project_id: '${{ vars.GCP_PROJECT_PREFIX }}-prod'
          gcp_region: ${{ vars.GCP_REGION }}
          service_name: '${{ matrix.image }}-stag'
          image_name: ${{ matrix.image }}
          image_tag: ${{ github.sha }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

  # The deployed frontend and backend together, signed out and read-only, against live staging: the
  # defects between components (config.json, CORS, the Worker, routing) that pass every unit test.
  # release-please waits on it, so a failing smoke test keeps this commit from being released.
  smoke:
    needs: services-frontend
    if: always() && needs.services-frontend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          SMOKE_BASE_URL: ${{ vars.STAGING_URL }}

  # Opens or updates the release PR and, on the release PR's own merge, tags the release (decision 30).
  # It waits on this commit's deploy and smoke test, so a release is only cut for a commit that is
  # live on staging with its artifacts in both stores. `if:` tests each direct need for `success`:
  # a bare `needs:` inherits a skip from two hops back, and always() opts out of that (decision 30).
  release-please:
    needs: [services-backend, services-frontend, smoke]
    if: |
      always() &&
      needs.smoke.result == 'success' &&
      needs.services-backend.result == 'success' &&
      needs.services-frontend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr_number: ${{ steps.release.outputs.prs_created == 'true' && fromJSON(steps.release.outputs.pr).number || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The PAT, so the release PR triggers the PR checks (decision 30).
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: ${{ vars.GCP_ROOT_PROJECT }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          secrets_list: |
            RELEASE_PLEASE_TOKEN=github_provider_token
      - name: Export Secrets
        shell: bash
        env:
          SECRETS: ${{ steps.secrets.outputs.secrets }}
        run: printf '%s\n' "$SECRETS" >> "$GITHUB_ENV"
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ env.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # The prod plan for the open release PR, so a reviewer sees what merging will apply (decision 31).
  plan-prod:
    needs: release-please
    if: needs.release-please.outputs.pr_number != '' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAN_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'
          # Same as every prod plan/apply, or the plan shows GOOGLE_CLIENT_ID being blanked.
          secrets: |
            TF_VAR_google_client_id=${{ vars.GOOGLE_CLIENT_ID }}
            TF_VAR_ci_service_account=${{ vars.PROMOTE_SERVICE_ACCOUNT }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pull_request_number: ${{ needs.release-please.outputs.pr_number }}

  # Deploys the release to production from the artifacts already in prod's stores (decision 30);
  # rollback is promote-release.yaml run by hand.
  promote:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/promote-release.yaml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      sha: ${{ github.sha }}
