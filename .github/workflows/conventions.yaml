name: 'Conventions'

# Separate from pull-request.yaml so a title edit reruns only these cheap checks. `edited` covers
# the title and the body (for the BREAKING CHANGE: footer).
on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: conventions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The squash commit subject is the PR title, and versioning parses it. Skipped in a merge queue,
  # where the title was already checked.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commit title
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|build|chore|ci|docs|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title '$TITLE' is not a Conventional Commit: type(scope)?!?: description, with type one of feat, fix, build, chore, ci, docs, perf, refactor, revert, style, test."
            exit 1
          fi

  # oasdiff against main's spec, unless the PR is marked breaking (`!` or `BREAKING CHANGE:`, read from
  # the squash commit in a merge queue), which also bumps major (decision 30).
  api-breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Full history, so origin/main is there to read main's spec from.
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          cache: false # decision 35
      - name: moon ci
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body || github.event.merge_group.head_commit.message }}
          MOON_BASE: origin/main
        run: |
          subject="${TITLE:-${BODY%%$'\n'*}}"
          re='^[a-z]+(\([^)]+\))?!:'
          if [[ "$subject" =~ $re ]] || grep -qE '^BREAKING[ -]CHANGE:' <<<"$BODY"; then
            echo "Marked breaking; skipping the API breaking-change check."
            exit 0
          fi
          moon ci packages/api:breaking
