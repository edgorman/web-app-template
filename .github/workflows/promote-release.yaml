name: 'Promote Release'

# Deploys a release to production from the commit-SHA artifacts already in prod's own stores:
# push-commit.yaml calls it when release-please cuts a release, and it is run by hand to roll back
# (or to finish a promotion that failed) by naming an earlier release tag. Nothing is rebuilt.
on:
  workflow_call:
    inputs:
      tag:
        description: 'The release tag being deployed, e.g. v1.2.3'
        type: string
        required: true
      sha:
        description: 'The commit the tag points at'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy, e.g. v1.2.3 - the latest to promote, an earlier one to roll back'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: promote-release-main
  cancel-in-progress: false

jobs:
  # Resolves what is being deployed. A manual run names only the tag, so its commit is read from it.
  target:
    # Every later job needs this one, so skipping it here skips the whole promotion on a repository
    # whose infrastructure/root hasn't been bootstrapped yet (docs/new-repo.md).
    if: vars.WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: target
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a release tag (vMAJOR.MINOR.PATCH)."; exit 1; }
          sha="${SHA:-$(git rev-list -n 1 "refs/tags/$TAG")}"
          test -n "$sha" || { echo "::error::No commit for tag $TAG."; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Step 1: infra applies before any service is touched, from the plan the release PR showed. If prod
  # changed since, as on any rollback, it plans again here.
  infrastructure-prod:
    needs: target
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.target.outputs.sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'
          # One client ID, defined in infrastructure/root, serves every environment.
          secrets: |
            TF_VAR_google_client_id=${{ vars.GOOGLE_CLIENT_ID }}
            TF_VAR_ci_service_account=${{ vars.SERVICE_ACCOUNT }}

  # Step 2: deploy the commit-SHA-tagged image already sitting in prod's own registry, pushed there
  # when this commit was built and deployed to staging (see Staging Deployments in `.github/AGENTS.md`).
  # Promotion is nothing but a deploy - it reads nothing from the staging project.
  services-backend:
    needs: [target, infrastructure-prod]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_url: ${{ steps.deploy.outputs.backend_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.target.outputs.sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      # Retention only: the release-<version> tag is what the registry's keep-releases cleanup policy
      # (infrastructure/root/artifact_stores.tf) matches, so a release's image outlives the
      # most-recent-N window for rollback. The deploy below still goes by commit SHA.
      - name: Tag the image with its release
        env:
          IMAGE: '${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_PREFIX }}-prod/backend/backend'
          RELEASE: ${{ needs.target.outputs.tag }}
          SHA: ${{ needs.target.outputs.sha }}
        run: gcloud artifacts docker tags add "$IMAGE:$SHA" "$IMAGE:release-$RELEASE" --quiet
      - id: deploy
        uses: ./.github/actions/backend-cloudrun-deploy
        with:
          gcp_project_id: '${{ vars.GCP_PROJECT_PREFIX }}-prod'
          gcp_region: ${{ vars.GCP_REGION }}
          service_name: 'backend-prod'
          image: '${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_PREFIX }}-prod/backend/backend:${{ needs.target.outputs.sha }}'

  # Step 3: fetch the commit-SHA folder already published to prod's own bucket when this commit was
  # built and validated on staging (a rollback fetches an earlier release's, already sitting there
  # too), then deploy those static files with config.json written from the just-promoted backend
  # URL. No cross-project read and no copy - the bucket promotion reads from is prod's own.
  services-frontend:
    needs: [target, infrastructure-prod, services-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.target.outputs.sha }}
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: ${{ vars.GCP_ROOT_PROJECT }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            CLOUDFLARE_API_TOKEN=cloudflare_api_token
            CLOUDFLARE_ACCOUNT_ID=cloudflare_account_id
      - uses: ./.github/actions/frontend-fetch
        with:
          gcp_project_id: '${{ vars.GCP_PROJECT_PREFIX }}-prod'
          sha: ${{ needs.target.outputs.sha }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/frontend-deploy
        with:
          secrets: ${{ steps.secrets.outputs.secrets }}
          cloudflare_project_name: '${{ vars.GCP_PROJECT_PREFIX }}-prod'
          backend_url: ${{ needs.services-backend.outputs.backend_url }}
          version: ${{ needs.target.outputs.tag }}
          environment: 'production'
          site_url: ${{ vars.PRODUCTION_URL }}
          site_name: ${{ vars.SITE_NAME }}
