name: 'Apply Prod Infrastructure (Manual)'

# An escape hatch, not the normal path: prod infrastructure changes through a release's promotion
# (promote-release.yaml). This only backfills a new per-environment resource into prod ahead of
# that, when a merge-time job now assumes it exists there (decision 17).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm: this runs terraform apply on the prod project right now, outside of a release promotion.'
        required: true

permissions:
  contents: read

concurrency:
  # Shared with Promote Release: both mutate prod's Terraform state, so one queues behind the other.
  group: promote-release-main
  cancel-in-progress: false

jobs:
  infrastructure-prod:
    if: vars.WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Confirmation
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "apply" ]; then
            echo "::error::Input 'confirm' must be exactly \"apply\" - refusing to run terraform apply on the prod project. If you're not deliberately backfilling a new resource ahead of a promotion, use Promote Release instead."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PROMOTE_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'
          secrets: |
            TF_VAR_google_client_id=${{ vars.GOOGLE_CLIENT_ID }}
            TF_VAR_ci_service_account=${{ vars.PROMOTE_SERVICE_ACCOUNT }}
