name: 'Frontend Build'
description: 'Installs dependencies and builds the frontend production bundle'

inputs:
  google_client_id:
    description: 'Google OAuth 2.0 client ID, baked in as VITE_GOOGLE_CLIENT_ID. Not a secret - it identifies the app.'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: services/frontend/package-lock.json

    - name: Install Dependencies
      shell: bash
      working-directory: services/frontend
      run: npm ci

    # The bundle is environment-neutral - no backend URL baked in - so one dist/ serves every
    # environment, told its backend at deploy time via config.json (decision 15).
    - name: Build
      shell: bash
      working-directory: services/frontend
      env:
        VITE_GOOGLE_CLIENT_ID: ${{ inputs.google_client_id }}
      run: npm run build
