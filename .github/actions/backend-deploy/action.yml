name: 'Backend Deploy'
description: 'Builds a backend-module image, pushes it to both environments'' Artifact Registries tagged with the commit SHA, and deploys it to staging Cloud Run'

inputs:
  gcp_project_id:
    description: 'GCP project the staging Artifact Registry repository and Cloud Run service live in'
    required: true
  prod_project_id:
    description: 'GCP project of the production Artifact Registry repository the image is also pushed to'
    required: true
  gcp_region:
    description: 'GCP region of both Artifact Registry repositories and the Cloud Run service'
    required: true
  service_name:
    description: 'Cloud Run service name (e.g. backend-stag)'
    required: true
  image_name:
    description: 'Which binary under services/backend/cmd to build, and the image name it is pushed under in the backend repository (e.g. backend)'
    required: false
    default: 'backend'
  image_tag:
    description: 'Tag to push the image under - the commit SHA, per the Staging Deployments section of `.github/AGENTS.md`'
    required: true
  workload_identity_provider:
    description: 'The Workload Identity Provider resource name'
    required: true
  service_account:
    description: 'The Google Service Account email'
    required: true

outputs:
  backend_url:
    description: 'Public URL of the deployed Cloud Run service'
    value: ${{ steps.deploy.outputs.backend_url }}

runs:
  using: "composite"
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: Configure Docker Auth
      shell: bash
      run: gcloud auth configure-docker "${{ inputs.gcp_region }}-docker.pkg.dev" --quiet

    - id: image
      shell: bash
      run: |
        echo "staging_ref=${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.gcp_project_id }}/backend/${{ inputs.image_name }}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
        echo "prod_ref=${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.prod_project_id }}/backend/${{ inputs.image_name }}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

    # One build feeds both registries; promotion deploys the tag already in prod's registry (decision
    # 15). The layer cache keeps an unchanged build cheap (decision 29).
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build And Push Image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: services/backend
        build-args: |
          COMMIT_SHA=${{ inputs.image_tag }}
          CMD=${{ inputs.image_name }}
        tags: |
          ${{ steps.image.outputs.staging_ref }}
          ${{ steps.image.outputs.prod_ref }}
        push: true
        # A plain single-platform image: no attestation manifest beside it.
        provenance: false
        cache-from: type=gha,scope=backend-${{ inputs.image_name }}
        cache-to: type=gha,mode=max,scope=backend-${{ inputs.image_name }}

    - id: deploy
      uses: ./.github/actions/backend-cloudrun-deploy
      with:
        gcp_project_id: ${{ inputs.gcp_project_id }}
        gcp_region: ${{ inputs.gcp_region }}
        service_name: ${{ inputs.service_name }}
        image: ${{ steps.image.outputs.staging_ref }}
