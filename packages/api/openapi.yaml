openapi: 3.0.3
info:
  title: Web app API
  description: |
    The contract the backend serves and the frontend calls. Both generate from this file (see
    packages/api/AGENTS.md): the backend's models and route table, and the frontend's types and
    typed client. A route, parameter or body is changed here first.

    Properties the server always sends are `required`; the backend emits every one of them, so a
    client never has to guard a missing field. A property that is not required is one where
    "absent" and "empty" mean different things to the server.
  version: 1.0.0

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and build information, for the GCP uptime check.
      description: Same answer as /debug. The uptime check matches the literal `"status":"ok"`.
      responses:
        '200': { $ref: '#/components/responses/Debug' }

  /debug:
    get:
      operationId: getDebug
      summary: Liveness and build information.
      responses:
        '200': { $ref: '#/components/responses/Debug' }

  /notes:
    get:
      operationId: listNotes
      summary: One page of the notes the caller may read, newest first.
      description: |
        Anonymous callers see public notes; a signed-in caller also sees their own. A caller
        continues a page by sending the `createdAt` of the last note it held as `startAfter`.
      security:
        - bearerAuth: []
          authProvider: []
        - {}
      parameters:
        - name: limit
          in: query
          description: How many notes a page holds. The backend applies its own default and cap when omitted.
          schema: { type: integer, minimum: 1 }
        - name: startAfter
          in: query
          description: Continues a previous page - the `createdAt` of the last note the previous one held.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: A page of notes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotePage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createNote
      summary: Make a new note owned by the caller.
      security:
        - bearerAuth: []
          authProvider: []
      requestBody: { $ref: '#/components/requestBodies/NoteRequest' }
      responses:
        '201':
          description: The created note.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        default: { $ref: '#/components/responses/Error' }

  /notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getNote
      summary: A single note, provided the caller may read it.
      description: A note the caller may not read is a 404, never a 403, so a refusal does not confirm it exists.
      security:
        - bearerAuth: []
          authProvider: []
        - {}
      responses:
        '200':
          description: The note.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: updateNote
      summary: Replace a note's client-settable fields. Only the owner may.
      security:
        - bearerAuth: []
          authProvider: []
      requestBody: { $ref: '#/components/requestBodies/NoteRequest' }
      responses:
        '200':
          description: The updated note.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteNote
      summary: Remove a note. Only the owner may.
      security:
        - bearerAuth: []
          authProvider: []
      responses:
        '204': { description: The note is gone. }
        default: { $ref: '#/components/responses/Error' }

  /users/me:
    get:
      operationId: getCurrentUser
      summary: The caller's own profile.
      description: |
        A client holds a credential, not a username: this is how it discovers the name it was given
        at sign-up.
      security:
        - bearerAuth: []
          authProvider: []
      responses:
        '200':
          description: The caller's profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: putUser
      summary: Create or replace the caller's own profile.
      description: |
        201 the first time, 200 thereafter. The owner comes from the verified credential, so a caller
        cannot name another profile to write.
      security:
        - bearerAuth: []
          authProvider: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCurrentUserRequest' }
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '201':
          description: The created profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteUser
      summary: Erase the caller's account - every note it wrote, then the profile.
      security:
        - bearerAuth: []
          authProvider: []
      responses:
        '204': { description: The account is gone. }
        default: { $ref: '#/components/responses/Error' }

  /users/{username}:
    get:
      operationId: getUser
      summary: The profile holding a username. Any caller may read any profile.
      description: |
        A 404 is also the answer to "is this name free?", so there is no separate availability route.
      security:
        - bearerAuth: []
          authProvider: []
        - {}
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The ID token the provider issued, verified by the backend on every request.
    authProvider:
      type: apiKey
      in: header
      name: Authorization-Provider
      description: Which provider issued the token. Only `google` is implemented.

  requestBodies:
    NoteRequest:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NoteRequest' }

  responses:
    Debug:
      description: The service is up.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DebugResponse' }
    Error:
      description: Every non-2xx response has this body.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    Visibility:
      type: string
      enum: [public, private]
      description: Who may read a note. The entity validates it too.

    Note:
      type: object
      description: |
        A note as a client sees it. It is the wire shape, not the stored entity: `authorUsername` is
        resolved on read and the owner's uid, which is never public, has no field here.
      required: [id, authorUsername, title, body, visibility, createdAt, updatedAt]
      properties:
        id: { type: string }
        authorUsername:
          type: string
          description: |
            The owner's username, resolved on read rather than stored, so a rename reaches every note
            at once. Empty for a note whose owner holds no profile.
        title: { type: string }
        body: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NotePage:
      type: object
      description: One page of `GET /notes`, newest first.
      required: [notes, hasMore]
      properties:
        notes:
          type: array
          items: { $ref: '#/components/schemas/Note' }
        hasMore: { type: boolean }

    NoteRequest:
      type: object
      description: |
        The body of both `POST /notes` and `PUT /notes/{id}`. The id, owner and timestamps are
        decided by the server, so none of them are here.
      required: [title, body, visibility]
      properties:
        title: { type: string }
        body: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }

    User:
      type: object
      description: |
        A profile as anybody may read it. The account's id is never public, so it has no field here.
      required: [username, bio, createdAt, updatedAt]
      properties:
        username:
          type: string
          description: The whole of a profile's public identity - the handle it is looked up by and the name readers see.
        bio: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CurrentUser:
      type: object
      description: The caller's own profile, which alone carries the account's id.
      required: [id, username, bio, createdAt, updatedAt]
      properties:
        id: { type: string }
        username: { type: string }
        bio: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UpdateCurrentUserRequest:
      type: object
      description: |
        The body of `PUT /users/me` - the client-settable half of a profile. The id comes from the
        verified token and the timestamps from the server.
      properties:
        username:
          type: string
          description: |
            Omitted keeps the name the profile holds (or draws one for a new profile); an explicit
            empty string is a name the backend rejects.
        bio:
          type: string
          description: Omitted clears the bio.

    ErrorResponse:
      type: object
      description: The body of every non-2xx response.
      required: [error]
      properties:
        error: { type: string }

    DebugResponse:
      type: object
      description: The Debug Endpoint Contract (docs/decisions/0024).
      required: [status, timestamp, environment, commit]
      properties:
        status: { type: string }
        timestamp: { type: string, format: date-time }
        environment: { type: string }
        commit: { type: string }
