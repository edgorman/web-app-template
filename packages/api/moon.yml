$schema: '../../.moon/cache/schemas/project.json'
layer: 'library'
tags: ['contract']

fileGroups:
  sources: ['openapi.yaml', 'package.json', 'package-lock.json']
  # A leading '/' makes these workspace-relative rather than project-relative, so a hand edit to
  # either generated output - not just a spec edit - marks drift affected too.
  generated:
    - '/services/backend/oapi-codegen.yaml'
    - '/services/backend/internal/api/**/*'
    - '/services/frontend/src/gen/**/*'

tasks:
  install:
    command: 'npm ci'
    inputs: ['package.json', 'package-lock.json']
    options:
      internal: true
  # Both generators, from the one spec. The Go one is a `go tool` pinned in services/backend/go.mod;
  # the TypeScript one is pinned in this project's package.json. Run from this project's root.
  generate:
    script: |
      (cd ../../services/backend && go tool oapi-codegen -config oapi-codegen.yaml ../../packages/api/openapi.yaml)
      npx openapi-typescript openapi.yaml -o ../../services/frontend/src/gen/schema.d.ts
    deps: ['install']
    inputs: ['@group(sources)', '/services/backend/oapi-codegen.yaml', '/services/backend/go.mod']
    options:
      cache: false
  drift:
    # Regenerates and fails on any difference from what is committed. `git status --porcelain`, not
    # `git add -A`, so a local run never stages the caller's working tree - only reads it.
    script: |
      npx openapi-typescript openapi.yaml -o ../../services/frontend/src/gen/schema.d.ts
      (cd ../../services/backend && go tool oapi-codegen -config oapi-codegen.yaml ../../packages/api/openapi.yaml)
      root="$(git rev-parse --show-toplevel)"
      paths="packages/api services/backend/internal/api services/frontend/src/gen"
      test -z "$(git -C "$root" status --porcelain -- $paths)" || { git -C "$root" status --porcelain -- $paths; exit 1; }
    deps: ['install']
    inputs: ['@group(sources)', '@group(generated)', '/services/backend/go.mod']
    options:
      cache: false
  breaking:
    # Against main's copy of the spec. The `conventions` workflow skips it for a PR marked breaking
    # (`!` in the title or a `BREAKING CHANGE:` footer). Not cached: main moves without this
    # project's inputs changing. A spec main does not have yet (the first one) has nothing to break.
    script: |
      base="$(mktemp)"
      git show origin/main:packages/api/openapi.yaml > "$base" 2>/dev/null || { echo 'No spec on origin/main yet; nothing to compare.'; exit 0; }
      go run github.com/oasdiff/oasdiff@v1.38.0 breaking "$base" openapi.yaml --fail-on ERR
    inputs: ['openapi.yaml']
    options:
      cache: false
