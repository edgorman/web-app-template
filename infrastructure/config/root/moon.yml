$schema: '../../../.moon/cache/schemas/project.json'
dependsOn: ['infra-root']
tags: ['deployment']

tasks:
  # A marker task: its `inputs` define what reaches this environment's plan/apply (decision 13).
  plan:
    command: 'noop'
    inputs:
      - 'terraform.tfbackend'
      - 'terraform.tfvars'
      - 'project://infra-root'
      # gcp-secret-manager is only used by root's jobs; the terraform actions are shared by every environment.
      - '/.github/actions/gcp-secret-manager/**/*'
      - '/.github/actions/terraform-pull-request/**/*'
      - '/.github/actions/terraform-push-commit/**/*'
      - '/.github/workflows/pull-request.yaml'
      - '/.github/workflows/push-commit.yaml'
    options:
      # Never runInCI: false: moon treats such a task as never affected in CI, which would hide it from
      # the `changed` jobs' `moon query affected` (decision 13).
      cache: false
