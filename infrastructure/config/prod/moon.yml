$schema: '../../../.moon/cache/schemas/project.json'
# The dependency on deploy-root is apply ordering, not a build edge, modelled so `moon
# project-graph` reads right; prod applies in promote-release.yaml, never on a bare merge.
dependsOn: ['infra-env', 'deploy-root']
tags: ['deployment']

tasks:
  # A marker task: its `inputs` define what reaches this environment's plan/apply (decision 13).
  plan:
    command: 'noop'
    inputs:
      - 'terraform.tfbackend'
      - 'terraform.tfvars'
      - 'project://infra-env'
      - '/.github/actions/terraform-pull-request/**/*'
      - '/.github/actions/terraform-push-commit/**/*'
      - '/.github/workflows/pull-request.yaml'
      - '/.github/workflows/push-commit.yaml'
      - '/.github/workflows/promote-release.yaml'
      - '/.github/workflows/apply-infrastructure-prod.yaml'
    options:
      # Never runInCI: false (decision 13).
      cache: false
