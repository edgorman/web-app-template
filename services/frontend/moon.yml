$schema: '../../.moon/cache/schemas/project.json'
language: 'typescript'
layer: 'application'
stack: 'frontend'
tags: ['typescript']
# Full source path, not 'api' - the workspace uses globFormat: 'source-path'.
dependsOn: ['packages/api']

# The typescript toolchain stays off: its sync rewrites the hand-maintained tsconfig references.
toolchains:
  typescript: false
# moon's own dependency install is off workspace-wide (.moon/toolchains.yml), so `install` is the
# one `npm ci` every task depends on.

fileGroups:
  sources: ['src/**/*', 'public/**/*', 'worker/**/*', 'e2e/**/*', 'index.html', 'vite.config.ts', 'playwright.config.ts', 'wrangler.jsonc']
  configs: ['package.json', 'package-lock.json', 'tsconfig*.json', '.oxlintrc.json']

tasks:
  install:
    command: 'npm ci'
    inputs: ['package.json', 'package-lock.json']
    options:
      internal: true
  lint:
    command: 'npm run lint'
    deps: ['install']
    inputs: ['@group(sources)', '@group(configs)']
  typecheck:
    command: 'npx tsc -b'
    deps: ['install']
    inputs: ['@group(sources)', '@group(configs)']
  test:
    command: 'npm test'
    deps: ['install']
    # An external project input, not a dependsOn relation: `--affected` doesn't follow graph relations,
    # and a spec-only edit must still mark this task affected (decision 12).
    inputs: ['@group(sources)', '@group(configs)', 'project://packages/api']
  build:
    command: 'npm run build'
    deps: ['install']
    inputs: ['@group(sources)', '@group(configs)']
    # The whole folder, not a glob: moon deletes files under `outputs` that don't match on hydration.
    outputs: ['dist']
  dev:
    command: 'npm run dev'
    deps: ['install']
    preset: 'server'
