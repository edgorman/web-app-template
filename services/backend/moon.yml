$schema: '../../.moon/cache/schemas/project.json'
language: 'go'
layer: 'application'
stack: 'backend'
tags: ['go']
# Full source path, not 'api' - the workspace uses globFormat: 'source-path'.
dependsOn: ['packages/api']

fileGroups:
  sources: ['**/*.go', 'go.mod', 'go.sum']

tasks:
  format:
    script: 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'
    inputs: ['@group(sources)']
  vet:
    command: 'go vet ./...'
    inputs: ['@group(sources)']
  test:
    command: 'go test ./...'
    # An external project input, not a dependsOn relation: `--affected` doesn't follow graph relations,
    # and a spec-only edit must still mark this task affected (decision 6). The emulator's address is
    # an input too, since with it set the Firestore tests run instead of skipping.
    inputs: ['@group(sources)', 'project://packages/api', '$FIRESTORE_EMULATOR_HOST']
  build:
    command: 'go build ./...'
    inputs: ['@group(sources)']
  image:
    # Matches backend-deploy's --build-arg COMMIT_SHA; the context stays './' so a standalone
    # `docker build services/backend` works too.
    script: 'docker build --build-arg COMMIT_SHA="${COMMIT_SHA:-unknown}" -t backend:${COMMIT_SHA:-local} .'
    inputs: ['@group(sources)', 'Dockerfile', '.dockerignore']
    options:
      cache: false
      runInCI: true
  dev:
    command: 'go run ./cmd/backend'
    preset: 'server'
  # The backend with no GCP credentials: the Firestore emulator must already be running and sign-in
  # is the development token (see "Running locally" in README.md).
  dev-local:
    command: 'go run ./cmd/backend'
    env:
      FIRESTORE_EMULATOR_HOST: '127.0.0.1:8081'
      GOOGLE_CLOUD_PROJECT: 'demo-app'
      ENVIRONMENT: 'local'
      DEV_AUTH: 'true'
    preset: 'server'
  # A marker task, like the deploy-*:plan ones: its 'inputs' decide whether a merge rebuilds the
  # image or reuses the last release's (push-commit.yaml's `changed` job, decision 12).
  publish:
    command: 'noop'
    inputs:
      - '@group(sources)'
      - 'Dockerfile'
      - '.dockerignore'
      - '/.github/actions/backend-deploy/**/*'
      - '/.github/actions/backend-cloudrun-deploy/**/*'
    options:
      cache: false

  # Marker for security.yaml's go job (decision 8): affected when govulncheck or gosec has new code to read.
  scan-go:
    command: 'noop'
    inputs:
      - '@group(sources)'
      - 'project://packages/api'
      - '/.prototools'
      - '/.github/workflows/security.yaml'
      - '/.github/scripts/advisory.sh'
    options:
      cache: false

  # Marker for security.yaml's image job.
  scan-image:
    command: 'noop'
    inputs:
      - '@group(sources)'
      - 'Dockerfile'
      - '.dockerignore'
      - '/.github/workflows/security.yaml'
      - '/.github/scripts/advisory.sh'
    options:
      cache: false
